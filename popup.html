<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library Tab</title>
<script type="module" src="./src/popup/main.ts"></script>
</head>
<body class="popup-body">

<div class="p-page">
  <img class="p-fav" id="pFav" alt="" hidden>
  <span class="p-title" id="pTitle">…</span>
</div>

<button class="p-btn" id="pQuick">
  <span class="p-ico">🔖</span>
  <span><b>Save</b><small>Link → Notion (shows on your new-tab grid)</small></span>
</button>

<button class="p-btn" id="pNotion">
  <span class="p-ico">📔</span>
  <span><b>Summarize &amp; save</b><small>Summary + images → Notion (right panel)</small></span>
</button>

<div class="p-status" id="pStatus"></div>

<div class="p-foot">
  <button class="p-link" id="pOpenLib">⊞ Open library</button>
  <button class="p-link" id="pSettings">Notion settings</button>
</div>

</body>
</html>
